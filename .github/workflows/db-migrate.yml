name: db-migrate
# Applies pending supabase/migrations/*.sql to the project database.
# The runner tracks applied versions, so this is always idempotent.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install driver
        run: pip install psycopg2-binary

      - name: Apply pending migrations
        env:
          SUPABASE_REF: ${{ secrets.SUPABASE_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
        run: python3 scripts/run_migrations.py
